<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Interline</title>
    <style>
      :root {
        --bg: #ffffff; --fg: #1f2329; --muted: #6b7280; --line: #e5e7eb; --accent: #2f6fed; --accent-fg: #ffffff; --field: #f6f7f9;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1f2126; --fg: #e8eaed; --muted: #9aa0a6; --line: #34373d; --accent: #5b8cff; --accent-fg: #0b1220; --field: #2a2d33; color-scheme: dark; }
      }
      [hidden] { display: none !important; }
      body { width: 300px; margin: 0; padding: 14px 16px 12px; background: var(--bg); color: var(--fg);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 600; font-size: 14px; }
      header img { width: 22px; height: 22px; }
      #toggle { width: 100%; padding: 9px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg);
        font: inherit; font-weight: 600; cursor: pointer; }
      #toggle.on { background: var(--field); color: var(--fg); outline: 1px solid var(--line); }
      #toggle:disabled { opacity: 0.5; cursor: default; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
      .row > span { color: var(--muted); white-space: nowrap; }
      select { flex: 1; min-width: 0; max-width: 170px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px;
        background: var(--field); color: var(--fg); font: inherit; }
      label.check { display: flex; align-items: center; gap: 8px; margin-top: 10px; cursor: pointer; }
      label.check input { margin: 0; accent-color: var(--accent); }
      hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0 2px; }
      .warn { margin-top: 10px; padding: 7px 9px; border-radius: 6px; background: rgba(209, 67, 67, 0.1); color: #d14343; }
      footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; color: var(--muted); font-size: 12px; }
      footer a { color: var(--accent); text-decoration: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <header><img src="icons/icon-32.png" alt="" /><span data-i18n="name"></span></header>
    <button id="toggle"></button>
    <div class="warn" id="warning" hidden></div>
    <div class="row"><span data-i18n="targetLanguage"></span><select id="targetLanguage"></select></div>
    <div class="row"><span data-i18n="engine"></span><select id="engine"></select></div>
    <div class="row"><span data-i18n="displayStyle"></span><select id="displayStyle"></select></div>
    <label class="check" id="alwaysRow"><input type="checkbox" id="always" /><span id="alwaysLabel"></span></label>
    <hr />
    <label class="check"><input type="checkbox" id="youtubeSubtitles" /><span data-i18n="youtubeSubtitles"></span></label>
    <label class="check"><input type="checkbox" id="autoPause" /><span data-i18n="autoPause"></span></label>
    <footer><span id="shortcut"></span><a id="options" data-i18n="moreSettings"></a></footer>
    <script src="popup.js"></script>
  </body>
</html>
