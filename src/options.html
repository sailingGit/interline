<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Interline</title>
    <link rel="icon" href="icons/icon-32.png" />
    <style>
      :root { --bg: #f6f7f9; --card: #ffffff; --fg: #1f2329; --muted: #6b7280; --line: #e5e7eb; --accent: #2f6fed; color-scheme: light; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #17181c; --card: #1f2126; --fg: #e8eaed; --muted: #9aa0a6; --line: #34373d; --accent: #5b8cff; color-scheme: dark; }
      }
      [hidden] { display: none !important; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
      h1 { display: flex; align-items: center; gap: 10px; font-size: 22px; margin: 0 0 20px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 24px 0 8px; }
      section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px 16px; }
      label { display: block; margin-top: 12px; font-weight: 600; }
      input:not([type=checkbox]), select, textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 7px 9px;
        border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; font-weight: 400; }
      textarea { min-height: 72px; resize: vertical; }
      label.check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
      label.check input { margin: 0; accent-color: var(--accent); }
      small { display: block; color: var(--muted); font-weight: 400; margin-top: 3px; }
      .bar { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
      button { padding: 8px 20px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      #saved { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1><img src="icons/icon-48.png" width="32" height="32" alt="" /><span data-i18n="options.title"></span></h1>

      <h2 data-i18n="options.general"></h2>
      <section>
        <label><span data-i18n="targetLanguage"></span><select id="targetLanguage"></select></label>
        <label><span data-i18n="displayStyle"></span><select id="displayStyle"></select></label>
        <label><span data-i18n="options.selectionMode"></span>
          <select id="selectionMode">
            <option value="icon" data-i18n="selection.icon"></option>
            <option value="off" data-i18n="selection.off"></option>
          </select>
        </label>
        <label><span data-i18n="options.sites"></span>
          <textarea id="alwaysSites" spellcheck="false"></textarea>
          <small data-i18n="options.sitesHelp"></small>
        </label>
      </section>

      <h2 data-i18n="options.engineSection"></h2>
      <section>
        <label><span data-i18n="engine"></span><select id="engine"></select></label>
        <small data-engine="google" data-i18n="options.googleHelp"></small>
        <label data-engine="openai"><span data-i18n="options.openaiKey"></span>
          <input id="openaiKey" type="password" autocomplete="off" />
          <small data-i18n="options.openaiKeyHelp"></small>
        </label>
        <label data-engine="openai"><span data-i18n="options.model"></span><input id="openaiModel" placeholder="gpt-6-luna" /></label>
        <label data-engine="custom"><span data-i18n="options.baseUrl"></span>
          <input id="customBaseUrl" placeholder="https://api.deepseek.com/v1" />
          <small data-i18n="options.baseUrlHelp"></small>
        </label>
        <label data-engine="custom"><span data-i18n="options.customKey"></span><input id="customKey" type="password" autocomplete="off" /></label>
        <label data-engine="custom"><span data-i18n="options.model"></span><input id="customModel" placeholder="deepseek-chat" /></label>
      </section>

      <h2 data-i18n="options.reading"></h2>
      <section>
        <label class="check"><input type="checkbox" id="youtubeSubtitles" /><span data-i18n="youtubeSubtitles"></span></label>
        <label class="check"><input type="checkbox" id="autoPause" /><span data-i18n="autoPause"></span></label>
      </section>

      <div class="bar"><button id="save" data-i18n="options.save"></button><span id="saved"></span></div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
